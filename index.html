<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>限定優惠下單 — AI 獲課副業實戰 × 行銷大師 24 大模組</title>
<meta name="description" content="今晚組合優惠價生效中：AI 獲課副業實戰 NT$32,000、行銷大師 24 大模組 NT$48,000，兩案合購再折 NT$18,000。截止前成立的訂單保留當下付款金額。">
<meta property="og:title" content="限定優惠下單 — AI 獲課副業實戰 × 行銷大師 24 大模組">
<meta property="og:description" content="今晚組合優惠價生效中，截止前成立的訂單保留當下付款金額。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Sora:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   下單頁 — 沿用 AI-Xplore 的深空藍 × 電光藍 × 金
   ground #040814 · ink #E6EEFC · beam #2E7BFF · glow #6FD3FF · gold #F5C451
   ========================================================================== */
:root{
  --ground:#040814; --ground-2:#070E20; --ground-3:#0A1428;
  --ink:#E6EEFC; --ink-2:#9DAFCC; --muted:#5C6E8E;
  --beam:#2E7BFF; --glow:#6FD3FF; --gold:#F5C451; --gold-2:#C79A3A;
  --hair:rgba(126,168,236,.16); --hair-2:rgba(126,168,236,.08);
  --display:'Syne','Noto Sans TC',system-ui,sans-serif;
  --sans:'Sora','Noto Sans TC',system-ui,sans-serif;
  --pad:clamp(20px,5vw,72px); --max:1180px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--ground)}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-weight:400;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:linear-gradient(180deg,#040814 0%,#050B1A 24%,#071023 52%,#050B1A 78%,#040814 100%);
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 640px at 80% 4%,rgba(46,123,255,.11),transparent 62%),
    radial-gradient(820px 560px at 8% 52%,rgba(245,196,81,.05),transparent 60%);
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.14}
h2,h3{text-wrap:balance}
::selection{background:var(--glow);color:#040814}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:6px}

.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--pad)}
.sect{position:relative;padding:clamp(56px,8vw,104px) 0}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--glow);margin:0 0 16px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--glow);opacity:.7;flex:none}
.chrome{
  background:linear-gradient(174deg,#FFFFFF 2%,#EAF3FF 16%,#B9CEEA 34%,#8DA6CB 48%,
    #FFFFFF 56%,#C4D8F2 70%,#93AAD0 84%,#E8F1FC 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.22)) drop-shadow(0 3px 1px rgba(4,8,20,.6));
}
.gold-t{
  background:linear-gradient(172deg,#FFF3D2 4%,#F5C451 30%,#B8862B 52%,#FFE9AE 66%,#C79A3A 86%,#FFF6DC 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.55));
}
.lead{color:var(--ink-2);font-size:clamp(14px,1.5vw,16px);max-width:64ch;margin:16px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  padding:14px 28px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.02em;
  cursor:pointer;border:1px solid transparent;white-space:nowrap;font-family:var(--sans);
  transition:transform .2s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease}
.btn--primary{background:linear-gradient(120deg,var(--beam),#5AA6FF 54%,var(--glow));color:#02060F;
  box-shadow:0 10px 30px -12px rgba(46,123,255,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.btn--primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -14px rgba(46,123,255,.95)}
.btn--gold{background:linear-gradient(120deg,#E9B94A,#FFE29A 52%,#D9A63C);color:#1B1206;
  box-shadow:0 10px 30px -12px rgba(245,196,81,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn--gold:hover{transform:translateY(-2px)}
.btn--ghost{border-color:var(--hair);color:var(--ink);background:rgba(12,24,48,.5)}
.btn--ghost:hover{border-color:var(--glow);color:var(--glow)}
.btn--block{width:100%}
.cta-slot{display:contents}
.cta-slot[data-filled="1"]>.cta-fallback{display:none}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:60;height:60px;display:flex;align-items:center;
  background:rgba(4,8,20,0);border-bottom:1px solid transparent;
  transition:background .3s ease,border-color .3s ease,backdrop-filter .3s ease}
.nav.on{background:rgba(4,8,20,.86);backdrop-filter:blur(14px);border-bottom-color:var(--hair-2)}
.nav__in{display:flex;align-items:center;gap:24px;width:100%}
.brand{font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--ink);color:#040814;
  display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:700}
.nav__links{margin-left:auto;display:flex;gap:22px;font-size:13px;color:var(--ink-2)}
.nav__links a:hover{color:var(--glow)}
@media(max-width:760px){.nav__links{display:none}}

/* ---------- hero ---------- */
.hero{padding:clamp(110px,16vw,168px) 0 clamp(28px,5vw,52px);text-align:left}
.hero h1{font-size:clamp(30px,5.4vw,58px)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  border:1px solid var(--hair);background:rgba(12,24,48,.6);font-size:11.5px;color:var(--ink-2)}
.badge b{color:var(--gold);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.countdown{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.countdown[hidden]{display:none}
.cd{min-width:64px;padding:10px 14px;border-radius:12px;border:1px solid var(--hair);
  background:rgba(10,20,40,.55);text-align:center}
.cd b{display:block;font-family:var(--display);font-size:22px;line-height:1.2}
.cd span{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* ---------- 方案卡 ---------- */
.plans{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.plan{position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
  border:1px solid var(--hair);background:linear-gradient(180deg,rgba(10,20,40,.82),rgba(6,12,28,.9));
  transition:border-color .25s ease,transform .25s ease,box-shadow .25s ease}
.plan:hover{transform:translateY(-3px);border-color:rgba(126,168,236,.34);
  box-shadow:0 28px 60px -34px rgba(0,0,0,.9)}
.plan--gold:hover{border-color:rgba(245,196,81,.4)}
.plan__cover{aspect-ratio:16/9;width:100%;object-fit:cover;background:#0A1428}
.plan__body{display:flex;flex-direction:column;flex:1;padding:clamp(20px,3vw,28px)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:10.5px;letter-spacing:.08em;border:1px solid var(--hair);color:var(--ink-2)}
.tag--live{color:var(--gold);border-color:rgba(245,196,81,.35);background:rgba(245,196,81,.07)}
.plan h3{font-size:clamp(19px,2.4vw,24px);margin-top:14px}
.plan__sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.price{margin-top:18px}
.price__was{font-size:12.5px;color:var(--muted);text-decoration:line-through}
.price__now{font-family:var(--display);font-size:clamp(30px,4.4vw,40px);line-height:1.1;margin-top:2px}
.price__off{margin-top:8px;font-size:12px;color:var(--glow)}
.plan--gold .price__off{color:var(--gold)}
.pts{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px;font-size:13.5px;color:var(--ink-2)}
.pts li{display:flex;gap:10px;align-items:flex-start}
.pts li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;border-radius:50%;
  background:var(--beam);box-shadow:0 0 8px rgba(46,123,255,.8)}
.plan--gold .pts li::before{background:var(--gold);box-shadow:0 0 8px rgba(245,196,81,.7)}
.plan__foot{margin-top:auto;padding-top:24px}

/* ---------- 合購 ---------- */
.bundle{margin-top:26px;border-radius:20px;padding:clamp(20px,3vw,30px);
  border:1px solid rgba(245,196,81,.26);
  background:linear-gradient(120deg,rgba(245,196,81,.08),rgba(10,20,40,.7) 46%);
  display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.bundle__t{font-family:var(--display);font-size:clamp(18px,2.4vw,22px)}
.bundle__n{color:var(--ink-2);font-size:13px;margin-top:6px;max-width:52ch}
.bundle__p{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.bundle__p b{font-family:var(--display);font-size:clamp(26px,3.6vw,34px)}
.bundle__p s{color:var(--muted);font-size:13px}

/* ---------- FAQ ---------- */
.faq{display:grid;gap:12px;margin-top:26px}
details{border:1px solid var(--hair);border-radius:14px;background:rgba(10,20,40,.5);
  padding:16px 20px;transition:border-color .2s ease}
details[open]{border-color:rgba(126,168,236,.32)}
summary{cursor:pointer;font-weight:500;font-size:14.5px;list-style:none;display:flex;
  justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--glow);font-size:18px;flex:none}
details[open] summary::after{content:"−"}
details p{margin:12px 0 0;color:var(--ink-2);font-size:13.5px}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--hair-2);padding:36px 0 96px;color:var(--muted);font-size:12px}
.foot__in{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start}
.foot a:hover{color:var(--glow)}
.foot__links{display:flex;gap:16px;flex-wrap:wrap}

/* ---------- 行動版底部下單列 ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;gap:10px;align-items:center;
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  background:rgba(4,8,20,.92);backdrop-filter:blur(14px);border-top:1px solid var(--hair-2);
  transform:translateY(110%);transition:transform .3s ease}
.bar.on{transform:none}
.bar__p{font-size:12px;color:var(--ink-2);line-height:1.3}
.bar__p b{display:block;font-family:var(--display);font-size:17px;color:var(--ink)}
.bar .btn{margin-left:auto;padding:12px 20px}
@media(max-width:760px){.bar{display:flex}.foot{padding-bottom:120px}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav__in">
    <a class="brand" href="#top"><i>99</i>限定優惠</a>
    <nav class="nav__links">
      <a href="#plans">方案</a>
      <a href="#bundle">合購</a>
      <a href="#faq">常見問題</a>
    </nav>
    <span class="cta-slot" data-cta="nav">
      <a class="btn btn--primary cta-fallback" href="#plans" style="padding:10px 20px">立即下單</a>
    </span>
  </div>
</header>

<section class="hero wrap" id="top">
  <span class="badge"><span class="dot"></span><b>優惠價生效中</b>‧ 今晚組合</span>
  <p class="eyebrow" id="eyebrow" style="margin-top:20px"></p>
  <h1 class="chrome" id="h1"></h1>
  <p class="lead" id="lead"></p>
  <div class="countdown" id="countdown" hidden>
    <div class="cd"><b data-cd="d">00</b><span>Days</span></div>
    <div class="cd"><b data-cd="h">00</b><span>Hrs</span></div>
    <div class="cd"><b data-cd="m">00</b><span>Min</span></div>
    <div class="cd"><b data-cd="s">00</b><span>Sec</span></div>
  </div>
</section>

<section class="sect wrap" id="plans" style="padding-top:clamp(24px,4vw,40px)">
  <div class="plans" id="planGrid"></div>
  <div class="bundle" id="bundleBox" hidden></div>
</section>

<section class="sect wrap" id="faq" style="padding-top:0">
  <p class="eyebrow">FAQ</p>
  <h2 class="chrome" style="font-size:clamp(22px,3.2vw,32px)">下單前常被問到的事</h2>
  <div class="faq" id="faqList"></div>
</section>

<footer class="foot wrap">
  <div class="foot__in" id="footer"></div>
</footer>

<div class="bar" id="bar">
  <div class="bar__p" id="barPrice"></div>
  <span class="cta-slot" data-cta="sticky">
    <a class="btn btn--gold cta-fallback" href="#plans">選方案下單</a>
  </span>
</div>

<script src="assets/plans.js"></script>
<script>
(function(){
  'use strict';
  var C = window.ORDER_CONFIG;
  var money = function(n){ return 'NT$ ' + n.toLocaleString('en-US'); };
  var $ = function(s,r){ return (r||document).querySelector(s); };

  /* ── 結帳連結：本站只負責把人帶到 99agent，金流/發票/訂單都在那邊 ────── */
  function checkoutURL(planCode){
    var k = C.checkout.param, u = new URL(C.checkout.base);
    u.searchParams.set(k.code, C.checkout.accessCode);
    u.searchParams.set(k.src,  C.checkout.source);
    if (planCode) u.searchParams.set(k.plan, planCode);
    return u.toString();
  }

  /* ── 文案 ───────────────────────────────────────────────────────── */
  $('#eyebrow').textContent = C.copy.eyebrow;
  $('#h1').textContent      = C.copy.title;
  $('#lead').textContent    = C.copy.lead;

  /* ── 方案卡 ─────────────────────────────────────────────────────── */
  var grid = $('#planGrid');
  C.plans.forEach(function(p){
    var gold = p.tone === 'gold';
    var el = document.createElement('article');
    el.className = 'plan' + (gold ? ' plan--gold' : '');
    el.innerHTML =
      '<img class="plan__cover" src="' + p.cover + '" alt="' + p.name + ' 方案圖" loading="lazy">' +
      '<div class="plan__body">' +
        '<div><span class="tag tag--live">今晚組合</span></div>' +
        '<h3 class="' + (gold ? 'gold-t' : 'chrome') + '">' + p.name + '</h3>' +
        '<p class="plan__sub">' + p.sub + '</p>' +
        '<div class="price">' +
          '<div class="price__was">原價 ' + money(p.original) + '</div>' +
          '<div class="price__now ' + (gold ? 'gold-t' : '') + '">' + money(p.pay) + '</div>' +
          '<div class="price__off">本頁已折抵 ' + money(p.original - p.pay) + '</div>' +
        '</div>' +
        '<ul class="pts">' + p.points.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul>' +
        '<div class="plan__foot">' +
          '<span class="cta-slot" data-cta="plan:' + p.code + '">' +
            '<a class="btn btn--block cta-fallback ' + (gold ? 'btn--gold' : 'btn--primary') + '" ' +
               'href="' + checkoutURL(p.code) + '" data-plan="' + p.code + '" ' +
               'target="_blank" rel="noopener">用優惠價下單</a>' +
          '</span>' +
        '</div>' +
      '</div>';
    grid.appendChild(el);
  });

  /* ── 合購：主方案照優惠價，另一案再折，兩邊當主方案結果一樣 ────────── */
  if (C.bundle && C.bundle.enabled && C.plans.length === 2){
    var main = C.plans.filter(function(p){ return p.code === C.bundle.primary; })[0] || C.plans[0];
    var add  = C.plans.filter(function(p){ return p !== main; })[0];
    var total = main.pay + add.addonPay;
    var was   = main.original + add.original;
    var box = $('#bundleBox');
    box.hidden = false;
    box.innerHTML =
      '<div>' +
        '<div class="bundle__t gold-t">' + C.bundle.label + '</div>' +
        '<p class="bundle__n">' + C.bundle.note + '</p>' +
        '<div class="bundle__p"><b class="gold-t">' + money(total) + '</b>' +
          '<s>原價 ' + money(was) + '</s></div>' +
      '</div>' +
      '<span class="cta-slot" data-cta="bundle">' +
        '<a class="btn btn--gold cta-fallback" href="' + checkoutURL(main.code) + '" ' +
           'data-plan="bundle" target="_blank" rel="noopener">一起帶走</a>' +
      '</span>';
  }

  /* ── FAQ ────────────────────────────────────────────────────────── */
  $('#faqList').innerHTML = C.faq.map(function(f){
    return '<details><summary>' + f.q + '</summary><p>' + f.a + '</p></details>';
  }).join('');

  /* ── footer ─────────────────────────────────────────────────────── */
  var co = C.company;
  $('#footer').innerHTML =
    '<div><div>' + co.name + '</div><div>' + co.addr + '</div>' +
    '<div>' + co.tel + ' / 統編 ' + co.vat + '</div></div>' +
    '<div class="foot__links">' + co.links.map(function(l){
      return '<a href="' + l.h + '" target="_blank" rel="noopener">' + l.t + '</a>';
    }).join('') + '</div>';

  /* ── 行動版底部列 ───────────────────────────────────────────────── */
  var low = C.plans.reduce(function(a,b){ return a.pay < b.pay ? a : b; });
  $('#barPrice').innerHTML = '<span>最低起</span><b>' + money(low.pay) + '</b>';

  /* ── 倒數 ───────────────────────────────────────────────────────── */
  if (C.copy.deadline){
    var end = new Date(C.copy.deadline).getTime(), cdEl = $('#countdown');
    if (!isNaN(end)){
      cdEl.hidden = false;
      var tick = function(){
        var d = Math.max(0, end - Date.now()), s = Math.floor(d / 1000);
        var v = { d: Math.floor(s/86400), h: Math.floor(s%86400/3600),
                  m: Math.floor(s%3600/60), s: s%60 };
        Object.keys(v).forEach(function(k){
          cdEl.querySelector('[data-cd="' + k + '"]').textContent = String(v[k]).padStart(2,'0');
        });
      };
      tick(); setInterval(tick, 1000);
    }
  }

  /* ── 捲動狀態 ───────────────────────────────────────────────────── */
  var nav = $('#nav'), bar = $('#bar');
  var onScroll = function(){
    nav.classList.toggle('on', scrollY > 20);
    bar.classList.toggle('on', scrollY > 420);
  };
  addEventListener('scroll', onScroll, { passive:true }); onScroll();

  /* ── 埋點：每次點下單都留下方案代碼 ─────────────────────────────── */
  document.addEventListener('click', function(e){
    var a = e.target.closest('[data-plan]');
    if (a && window.mojiTrack) window.mojiTrack('checkout_click', { plan: a.dataset.plan, href: a.href });
  });

  /* ── 外掛落點：之後要換成站內購物車元件就掛這裡 ─────────────────── */
  window.OrderPage = {
    config: C,
    checkoutURL: checkoutURL,
    slots: function(){
      return [].map.call(document.querySelectorAll('.cta-slot'), function(s){ return s.dataset.cta; });
    },
    mountCTA: function(name, el){
      var s = document.querySelector('.cta-slot[data-cta="' + name + '"]');
      if (!s) return false;
      s.appendChild(el); s.dataset.filled = '1'; return true;
    }
  };
})();
</script>
<script defer src="assets/analytics.js"></script>
</body>
</html>
